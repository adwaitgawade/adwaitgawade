<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Adwait Gawade, Java full-stack and cloud engineer</title>
  <desc id="desc">A hand-drawn sunset landscape sketches itself in ink, then fills with colour: rolling hills, two turning windmills, a small cabin with a lit window and a tree, with Adwait's name, role and stack on the left.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="420" rx="18"/></clipPath>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d50"/>
      <stop offset=".3" stop-color="#39307c"/>
      <stop offset=".5" stop-color="#5a3a8e"/>
      <stop offset=".7" stop-color="#c45f9a"/>
      <stop offset=".84" stop-color="#f6a070"/>
      <stop offset="1" stop-color="#ffd488"/>
    </linearGradient>
    <radialGradient id="gSun">
      <stop offset="0" stop-color="#fff0c0" stop-opacity=".9"/>
      <stop offset=".2" stop-color="#ffd08c" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#ff8c7a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff7a8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a886c4"/><stop offset="1" stop-color="#e6a8a8"/></linearGradient>
    <linearGradient id="gMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa88a"/><stop offset="1" stop-color="#3f7468"/></linearGradient>
    <linearGradient id="gNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa75c"/><stop offset=".5" stop-color="#2f6e5a"/><stop offset="1" stop-color="#1f4a55"/></linearGradient>
    <linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9c8"/><stop offset=".55" stop-color="#f4a4b4"/><stop offset="1" stop-color="#b47ac4"/></linearGradient>
    <linearGradient id="gRoof" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e08060"/><stop offset="1" stop-color="#9a4a50"/></linearGradient>
    <linearGradient id="gWall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6dcae"/><stop offset="1" stop-color="#b48a84"/></linearGradient>
    <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="1" stop-color="#ff9a48"/></linearGradient>
    <radialGradient id="gFly"><stop offset="0" stop-color="#fff2b0"/><stop offset=".35" stop-color="#ffd27a" stop-opacity=".6"/><stop offset="1" stop-color="#ffb860" stop-opacity="0"/></radialGradient>
    <filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2"/>
    </filter>
  </defs>

  <style>
    .ink { stroke: #35202e; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;
      stroke-dasharray: 1; stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: .55;
      animation: draw 1.8s cubic-bezier(.2,.7,.2,1) var(--d, 0s) both,
                 wash 1.6s ease-out calc(var(--d, 0s) + 1.5s) both; }
    .line { fill: none; stroke-dasharray: 1; animation: draw 1.8s cubic-bezier(.2,.7,.2,1) var(--d, 0s) both; }
    .sky { animation: fade 2.2s ease-out 2.4s both; }
    .after { animation: fade 1.6s ease-out 3.6s both; }
    .t { font-family: Georgia, 'Times New Roman', serif; }
    .name { font-size: 64px; font-style: italic; fill: #fdf1dc;
      animation: rise .9s ease-out .2s both, toCream 1.4s ease-out 2.8s both; }
    .role { font-size: 25px; fill: #f8cfae;
      animation: rise .9s ease-out .5s both, toPeach 1.4s ease-out 2.9s both; }
    .stack { font-size: 17px; letter-spacing: .04em; fill: #e6d2ea;
      animation: rise .9s ease-out .8s both, toLilac 1.4s ease-out 3s both; }
    .spin { animation: spin 9s linear 3.4s infinite; }
    .spin.slow { animation-duration: 13s; animation-direction: reverse; }
    .drift { animation: drift 22s ease-in-out 3.6s infinite alternate; }
    .drift.b { animation-duration: 28s; animation-delay: 3s; }
    .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 5s ease-in-out 4s infinite alternate; }
    .star { animation: twinkle 3s ease-in-out infinite alternate; }
    .flicker { animation: flicker 2.6s steps(6) 4s infinite; }
    .smoke { animation: smoke 4.5s ease-out infinite; }
    .fly { animation: fly 6s ease-in-out infinite alternate; }

    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes wash { from { fill-opacity: 0; stroke-opacity: 1; } to { fill-opacity: 1; stroke-opacity: .55; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes toCream { from { fill: #35202e; } to { fill: #fdf1dc; } }
    @keyframes toPeach { from { fill: #6a3f44; } to { fill: #f8cfae; } }
    @keyframes toLilac { from { fill: #6a3f44; } to { fill: #e6d2ea; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { to { transform: translateX(46px); } }
    @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
    @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
    @keyframes flicker { 0%,100% { opacity: 1; } 40% { opacity: .82; } 60% { opacity: .95; } 80% { opacity: .86; } }
    @keyframes smoke { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 15% { opacity: .5; } 100% { opacity: 0; transform: translate(14px,-46px) scale(1.6); } }
    @keyframes fly { from { transform: translate(0,0); } to { transform: translate(18px,-10px); } }

    @media (prefers-reduced-motion: reduce) {
      *, .ink, .line, .name, .role, .stack { animation: none !important; }
    }
  </style>
  <g clip-path="url(#frame)">

  <!-- paper, then the sky washes in over it -->
  <rect width="1200" height="420" fill="#fbf5e6"/>
  <g class="sky">
    <rect width="1200" height="420" fill="url(#gSky)"/>
    <circle cx="980" cy="270" r="300" fill="url(#gSun)"/>
  </g>

  <g class="after">
    <circle class="star" cx="560" cy="34" r="1.6" fill="#fff6da"/>
    <circle class="star" cx="640" cy="62" r="1.1" fill="#fff6da" style="animation-delay:-1s"/>
    <circle class="star" cx="720" cy="26" r="1.8" fill="#fff6da" style="animation-delay:-2s"/>
    <circle class="star" cx="812" cy="48" r="1.2" fill="#fff6da" style="animation-delay:-.5s"/>
    <circle class="star" cx="930" cy="22" r="1.5" fill="#fff6da" style="animation-delay:-1.6s"/>
    <circle class="star" cx="1010" cy="40" r="1" fill="#fff6da" style="animation-delay:-2.4s"/>
    <circle class="star" cx="1140" cy="30" r="1.7" fill="#fff6da" style="animation-delay:-.8s"/>
    <circle class="star" cx="1176" cy="96" r="1.1" fill="#fff6da" style="animation-delay:-1.3s"/>
    <circle class="star" cx="470" cy="22" r="1.2" fill="#fff6da" style="animation-delay:-2.1s"/>
    <circle class="star" cx="380" cy="44" r="1" fill="#fff6da" style="animation-delay:-.3s"/>
    <circle class="star" cx="44" cy="30" r="1.4" fill="#fff6da" style="animation-delay:-1.8s"/>
    <circle class="star" cx="250" cy="20" r="1.1" fill="#fff6da" style="animation-delay:-2.7s"/>
  </g>

  <g filter="url(#rough)">
    <!-- sun -->
    <circle class="ink" pathLength="1" cx="980" cy="270" r="46" fill="#fff2c8" style="--d:.3s"/>

    <!-- far hills -->
    <path class="ink" pathLength="1" style="--d:.2s" fill="url(#gFar)"
      d="M0 300 C150 270 300 292 420 280 S700 248 850 268 S1100 258 1200 274 L1200 420 L0 420 Z"/>

    <!-- clouds -->
    <g transform="translate(620 92) scale(1.2)"><g class="drift">
      <path class="ink" pathLength="1" style="--d:.5s" fill="url(#gCloud)"
        d="M0 0 C-2 -16 18 -24 30 -14 C38 -30 66 -28 70 -8 C86 -10 92 8 78 12 L-6 12 C-20 10 -16 -4 0 0 Z"/>
    </g></g>
    <g transform="translate(880 156) scale(.9)"><g class="drift b">
      <path class="ink" pathLength="1" style="--d:.9s" fill="url(#gCloud)"
        d="M0 0 C-2 -16 18 -24 30 -14 C38 -30 66 -28 70 -8 C86 -10 92 8 78 12 L-6 12 C-20 10 -16 -4 0 0 Z"/>
    </g></g>
    <g transform="translate(1060 74) scale(1.1)"><g class="drift">
      <path class="ink" pathLength="1" style="--d:1.2s" fill="url(#gCloud)"
        d="M0 0 C-2 -16 18 -24 30 -14 C38 -30 66 -28 70 -8 C86 -10 92 8 78 12 L-6 12 C-20 10 -16 -4 0 0 Z"/>
    </g></g>

    <!-- birds -->
    <g class="drift b">
      <path class="line ink" pathLength="1" style="--d:2.6s" d="M812 206 q6 -6 12 0 q6 -6 12 0"/>
      <path class="line ink" pathLength="1" style="--d:2.7s" d="M842 194 q5 -5 10 0 q5 -5 10 0"/>
    </g>

    <!-- mid hills -->
    <path class="ink" pathLength="1" style="--d:.6s" fill="url(#gMid)"
      d="M0 340 C200 320 380 346 560 330 S860 300 1000 318 S1150 330 1200 322 L1200 420 L0 420 Z"/>

    <!-- windmills -->
    <path class="ink" pathLength="1" style="--d:1.3s" fill="#f2e2e6" d="M753 322 L757.5 252 L762.5 252 L767 322 Z"/>
    <g transform="translate(760 252)"><g class="spin">
      <path class="ink" pathLength="1" style="--d:1.6s" fill="#fff8ee" d="M0 0 L-3 -6 L-2 -36 L2 -36 L3 -6 Z"/>
      <path class="ink" pathLength="1" style="--d:1.7s" fill="#fff8ee" d="M0 0 L-3 -6 L-2 -36 L2 -36 L3 -6 Z" transform="rotate(120)"/>
      <path class="ink" pathLength="1" style="--d:1.8s" fill="#fff8ee" d="M0 0 L-3 -6 L-2 -36 L2 -36 L3 -6 Z" transform="rotate(240)"/>
      <circle class="after" cx="0" cy="0" r="3.6" fill="#d8d4e4" stroke="#35202e" stroke-opacity=".55"/>
    </g></g>
    <path class="ink" pathLength="1" style="--d:1.5s" fill="#f2e2e6" d="M1076 326 L1078.5 280 L1081.5 280 L1084 326 Z"/>
    <g transform="translate(1080 280)"><g class="spin slow">
      <path class="ink" pathLength="1" style="--d:1.8s" fill="#fff8ee" d="M0 0 L-2 -4 L-1.5 -25 L1.5 -25 L2 -4 Z"/>
      <path class="ink" pathLength="1" style="--d:1.9s" fill="#fff8ee" d="M0 0 L-2 -4 L-1.5 -25 L1.5 -25 L2 -4 Z" transform="rotate(120)"/>
      <path class="ink" pathLength="1" style="--d:2s" fill="#fff8ee" d="M0 0 L-2 -4 L-1.5 -25 L1.5 -25 L2 -4 Z" transform="rotate(240)"/>
      <circle class="after" cx="0" cy="0" r="2.6" fill="#d8d4e4" stroke="#35202e" stroke-opacity=".55"/>
    </g></g>

    <!-- near meadow -->
    <path class="ink" pathLength="1" style="--d:1s" fill="url(#gNear)"
      d="M0 380 C260 362 520 388 760 372 S1060 360 1200 370 L1200 420 L0 420 Z"/>

    <!-- tree -->
    <g class="sway">
      <path class="ink" pathLength="1" style="--d:1.8s" fill="#9a5f45" d="M567 384 L569 352 L575 352 L577 384 Z"/>
      <path class="ink" pathLength="1" style="--d:2s" fill="#4a9a58"
        d="M548 344 C540 326 556 308 572 312 C588 304 604 322 598 340 C602 354 584 362 572 356 C560 362 544 356 548 344 Z"/>
    </g>

    <!-- cabin -->
    <path class="ink" pathLength="1" style="--d:2.3s" fill="#c8603f" d="M652 337 L652 314 L660 314 L660 337 Z"/>
    <path class="ink" pathLength="1" style="--d:2s" fill="url(#gWall)" d="M612 381 L612 346 L668 346 L668 381 Z"/>
    <path class="ink" pathLength="1" style="--d:2.2s" fill="url(#gRoof)" d="M604 348 L640 318 L676 348 Z"/>
    <g class="flicker"><path class="ink" pathLength="1" style="--d:2.4s" fill="url(#gWin)" d="M621 356 h14 v12 h-14 Z"/></g>
    <path class="ink" pathLength="1" style="--d:2.4s" fill="#7a4a42" d="M645 381 v-18 a7 7 0 0 1 14 0 v18 Z"/>
  </g>

  <!-- living details once the colour is in -->
  <g class="after">
    <circle cx="628" cy="362" r="26" fill="url(#gFly)" opacity=".55" class="flicker"/>
    <circle class="smoke" cx="656" cy="308" r="5" fill="#f2e4e8"/>
    <circle class="smoke" cx="656" cy="308" r="5" fill="#f2e4e8" style="animation-delay:1.5s"/>
    <circle class="smoke" cx="656" cy="308" r="5" fill="#f2e4e8" style="animation-delay:3s"/>
    <circle class="fly" cx="520" cy="372" r="7" fill="url(#gFly)"/>
    <circle class="fly" cx="700" cy="392" r="6" fill="url(#gFly)" style="animation-delay:-2s"/>
    <circle class="fly" cx="860" cy="378" r="7" fill="url(#gFly)" style="animation-delay:-4s"/>
    <circle class="fly" cx="980" cy="398" r="5" fill="url(#gFly)" style="animation-delay:-1s"/>
    <circle class="fly" cx="1110" cy="386" r="6" fill="url(#gFly)" style="animation-delay:-3s"/>
  </g>

  <!-- details -->
  <text class="t name" x="64" y="150">Adwait Gawade</text>
  <path class="line" pathLength="1" style="--d:.8s" stroke="#ffc978" stroke-width="2.5" stroke-linecap="round"
    d="M66 170 C160 163 300 174 444 165"/>
  <text class="t role" x="64" y="210">Java full-stack &amp; cloud engineer</text>
  <text class="t stack" x="64" y="248">Java · Spring Boot · Python · FastAPI · Next.js · PostgreSQL · AWS</text>
  </g>
</svg>
