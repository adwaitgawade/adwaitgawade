<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 844" width="1200" height="844" role="img" aria-labelledby="title desc">
  <title id="title">What I build with</title>
  <desc id="desc">Adwait's stack drawn as six constellations in a night sky. Backend: Java 8+, Spring Boot, Python, FastAPI, Spring Data JPA, REST APIs, SOLID and design patterns, multithreading. Frontend: Next.js App Router, React, TypeScript, Server Components, HTML and CSS. Data and messaging: PostgreSQL, Aurora PostgreSQL, PostGIS, TimescaleDB, Redis, AWS SQS and SNS. Cloud: AWS EC2, ECS, RDS, S3, Lambda, Hetzner Cloud, Cloudflare R2, Dokploy, Vercel. Quality and ops: Docker, SonarQube, Trivy, OpenTelemetry, PostHog, Locust. AI tooling: RAG, MCP, LangChain, LangSmith.</desc>
  <defs>
    <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0f2e"/>
      <stop offset=".7" stop-color="#1b1d50"/>
      <stop offset="1" stop-color="#2f2a68"/>
    </linearGradient>
    <radialGradient id="gStar"><stop offset="0" stop-color="#fff2c4" stop-opacity=".55"/><stop offset="1" stop-color="#ffc978" stop-opacity="0"/></radialGradient>
    <radialGradient id="gMoon"><stop offset="0" stop-color="#fff6da" stop-opacity=".35"/><stop offset="1" stop-color="#fff6da" stop-opacity="0"/></radialGradient>
    <mask id="crescent"><rect width="1200" height="844" fill="#fff"/><circle cx="1094" cy="88" r="27" fill="#000"/></mask>
    <clipPath id="frame"><rect width="1200" height="844" rx="18"/></clipPath>
    <filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
  </defs>

  <style>
    .t { font-family: Georgia, 'Times New Roman', serif; }
    .h { font-size: 40px; font-style: italic; fill: #fdf1dc; }
    .g { font-size: 23px; font-style: italic; fill: #ffc978; }
    .lbl { font-size: 15.5px; fill: #ecdcef; }
    .lines { fill: none; stroke: #b9a6d8; stroke-opacity: .55; stroke-width: 1.4; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s cubic-bezier(.3,.6,.2,1) var(--d) forwards; }
    .uline { fill: none; stroke: #ffc978; stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .grp { opacity: 0; animation: fade .9s ease-out var(--d) forwards; }
    .glow { fill: url(#gStar); }
    .star { fill: #fff6da; animation: twinkle 3s ease-in-out infinite alternate; }
    .dust { animation: twinkle 4s ease-in-out infinite alternate; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .lines, .uline { stroke-dashoffset: 0; }
      .grp { opacity: 1; }
    }
  </style>

